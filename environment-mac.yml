# Conda environment for macOS (mirrors the existing frsb env).
# Usage: conda env update -f environment-mac.yml && pip install -e .
name: frsb
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==1.24.1
      - pandas
      - pyarrow
      - scipy
      - statsmodels
      - matplotlib
      - seaborn
      - scikit-learn
      - h5py==3.8.0
      - tables==3.9.2
      - pyyaml
      - opencv-contrib-python
      - tqdm
      - ipykernel
      - jupyter
      - ipympl
      # dev
      - pytest
      - ruff
