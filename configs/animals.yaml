# Per-animal metadata for the stroke orofacial cohort.
# This is the single source of truth — no notebook may redefine these values.
#
# Convention: stroke_date is the date of the LAST PRE-STROKE SESSION.
# The stroke is induced after that day's behavioral session.
# Sessions on stroke_date are baseline; only sessions after are post-stroke.
#
# Source: transcribed from legacy notebooks on 2026-04-17.
#   - 20260203_DLC_analysis_ws_aligned_parquet_input_tongue.ipynb (ANIMALS dict)
#   - 20260416_DLC_analysis_ws_aligned_parquet_input_jaw.ipynb (ANIMALS dict)
#   Cross-checked: all stroke dates, session ranges, and analysis params are
#   identical across both notebooks' three repeated declarations.
#
# Exclusions: scoped to dotted hierarchical analysis-context tags
# (Phase 7-pre, 2026-04-22). Valid top-level tags: spout_behavior,
# alignment, dlc (with sub-tags dlc.io, dlc.spatial, dlc.kinematics.*).
# Prefix-match semantics — applies_to: [dlc] matches
# dlc.kinematics.tongue, dlc.spatial, etc. Legacy applies_to: [all]
# is rejected at load time; use the explicit tag list instead.
# See src/stroke_orofacial/animals.py Exclusion.applies docstring
# and MIGRATION_LOG.md Phase 7-pre entry.
#
# Cohort metadata (sex, date_of_birth, genotype, stroke_laser_power_mW) added
# 2026-04-20 per Audit-10 Q7 resolution (see DECISIONS.md 2026-04-19 entry).
# Source: Priya's direct cohort records. Ages at stroke range 95–101 days
# (~14 weeks, standard adult-mouse age). Genotype annotation "negative
# littermate" on PS49 / PS50 refers to breeding-scheme negative result
# (still C57BL/6J base line, still received stroke induction).
#
# wavesurfer_sides_match_mouse_sides (task #17, added 2026-04-20) controls
# whether the wavesurfer acquisition's Lick_L / Reward_L channels
# correspond directly to the mouse's L side (true) or are mirrored
# (false → wavesurfer L = mouse R). The entire PS46–PS55 cohort was
# acquired on the mirrored rig, so all are explicitly false. Translation
# to mouse frame happens at output emission boundaries per
# src/stroke_orofacial/lr_convention.py; internal pipeline arithmetic
# stays on the wavesurfer frame to preserve Phase 3/4/5/6 parity.
#
# kinematics_baselines (Phase 7a.1, added 2026-04-22) carries the per-
# animal per-bodypart (x0, y0) origin used by the Phase 7a interpolation
# module to center the DLC kinematic traces. Required for every animal
# and for both bodyparts (tongue, jaw) — missing entries fail load.
# Seed values come from docs/phase-7/baseline-seed-table.md §"Scope-
# filtered re-analysis": the X0/Y0 scalars stored in every in-scope
# legacy v5p3 NPZ on MICROSCOPE, which the consolidated pipeline must
# reproduce bit-identically for parity. Tongue is uniform at (0, -110)
# across the cohort; jaw varies — (0, 310) for PS46–PS50, (12, 290)
# for PS51/PS54, (0, 290) for PS55. See AnimalInfo.kinematics_baselines
# and AnimalInfo.get_kinematics_baseline() in
# src/stroke_orofacial/animals.py.
#
# bin_days (Phase 7a.4, added 2026-04-30) carries the per-animal day-
# bin width used by the Cell 42 day-binned cross-session aggregator
# (src/stroke_orofacial/dlc_kinematics/_day_binned.py). Values come from
# the legacy MOUSE_SPECS dict in
# 20260203_DLC_analysis_ws_aligned_parquet_input_tongue.ipynb Cell 42:
# 2 days for the early cohort PS46–PS50 (denser sessions, 4-week stroke
# follow-up); 7 days for the later cohort PS51/PS54/PS55 (sparser
# sessions, 12-week follow-up). The aggregator anchors bins on
# rel_day=0 (last pre-stroke session); see DECISIONS.md Phase 7a.4
# entry. Default for any future animal is 1 (per-day bins).

PS46:
  stroke_date: 2025-03-13
  sessions:
    start: 2025-03-07
    end: 2025-04-06
  exclusions: []
  recovery_phenotype: null
  sex: F
  date_of_birth: 2024-12-03
  genotype: "C57BL/6J"
  stroke_laser_power_mW: 2.2
  # stroke_laterality added 2026-05-13 (Task 3 Round 2.8 scaffolding
  # for the future pub-figures phase). All 8 current cohort animals
  # are "L"; the loader accepts {"L", "R"} only.
  stroke_laterality: "L"
  wavesurfer_sides_match_mouse_sides: false
  bin_days: 2
  analysis_params:
    break_thr_trialmax: 12000.0
    break_thr_alllicks: 9000.0
  kinematics_baselines:
    tongue:
      x0: 0.0
      y0: -110.0
    jaw:
      x0: 0.0
      y0: 310.0

