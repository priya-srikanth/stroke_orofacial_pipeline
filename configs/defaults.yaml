# Default analysis parameters (cohort-wide).
# Per-session overrides live in configs/session_overrides.yaml.
# Modules load these via stroke_orofacial config utilities.
# Override per-notebook in the USER INPUTS cell.
#
# Authoritative source: params dict from legacy canonical notebook
# batch_process_20260410PS.ipynb (Rule 1: latest YYYYMMDD).

# ---- Spout behavior processing ----

process_treadmill_signal:
  offset_in_volts: 1.2587643276652853
  voltSec_per_rot: 0.382
  mm_per_rot: 29.25
  sample_rate: 1000
  smoothing_sigma: 0.15

find_running_bouts:
  thresh_speed: 5
  max_gap_duration: 0.3
  min_duration: 2.0
  allow_licks: false
  min_lick_distance: 1.5

find_licks_and_rewards:
  lick_detection:
    thresh_upper: 2.5
    thresh_lower: 0.5
    duration_lockout_falling_edge: [0.001, 0.02]
  reward_detection:
    thresh: 0.5

find_grooming_bouts:
  amplitude_threshold_lick_detection: 2.5
  sign_threshold_lick_detection: -1
  duration_widen_conj_before: 0.020
  duration_widen_conj_after: 0.020
  duration_maxThresh_long: 0.400
  duration_widen_bad_before: 5.000
  duration_widen_bad_after: 5.000
  duration_minThresh_good: 10.000

find_quiet_bouts:
  speed_threshold: 1
  min_quiet_duration: 10
  treadmillSlow_time_buffer: [3, 3]
  lick_time_buffer: [1, 3]
  reward_time_buffer: [0.1, 8]
  groom_time_buffer: [6, 6]

find_peri_reward_periods:
  window_around_reward: [0, 6]

find_peri_reward_and_tone_periods:
  window_around_reward: [0, 6]

# ---- Alignment ----

alignment:
  csv_idx_sync: 2          # column index in camera CSV for sync signal
  csv_idx_time: 0          # column index in camera CSV for frame tick counter
  key_sync: "Sync_signal"  # wavesurfer channel name for sync signal
  fps_cam: 250.0           # camera frame rate (Hz)
  edge_threshold: 0.5      # rising-edge threshold on normalized [0,1] scale
  normalize_p_lo: 5        # robust percentile for min-max normalization
  normalize_p_hi: 95       # robust percentile for min-max normalization
  window: 20               # edge-sequence matching window size
  p: 0.1                   # L-p norm exponent for matching
  min_matched_edges: 5     # minimum matched edges for valid alignment
  cam_idx: 2               # which camera to align (cam2 = DLC camera)

# ---- DLC centering ----

dlc_centering:
  likelihood_threshold: 0.7   # used ONLY for computing center, NOT for dropping rows
  default_mode: "nose"        # ultimate fallback only; per-bodypart defaults under
                              # dlc_spatial.bodyparts.{bp}.center_mode are the primary
                              # source (added in Phase 4.5-lite, 2026-04-20)
  compression: "zstd"         # parquet compression

# ---- DLC spatial analyses ----
# Per-(bodypart, center_mode) plotting parameters per DECISIONS.md
# "Phase 5+ downstream analyses: preserve per-(bodypart, center_mode) plotting parameters"

dlc_spatial:
  heatmap_nbins: 100              # fine-resolution grid for per-session heatmap viz
  target_bin_size_x: 25.0         # coarser stats grid: nx = round(span_x / bin_size), min 5
  target_bin_size_y: 25.0         # coarser stats grid: ny = round(span_y / bin_size), min 5
  apply_x_range: false            # DEPRECATED fallback (Phase 4.5-lite): use
  x_range: [-200, 200]            # bodyparts.{bp}.per_center_mode.{mode}.x_range instead.
  save_dpi: 200                   # PNG save resolution
  # Per-(bodypart, center_mode) axis limits.
  # Derived from PS46/20250307 data ranges with ~25% margin.
  # Limits set to null are not yet validated — Phase 6+ will fill in
  # when reward-aligned analyses are tested on those combinations.
  bodyparts:
    nose:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "gist_ncar"
      per_center_mode:
        nose:
          xlim: [-150, 150]
          ylim: [-120, 130]
        spout_midpoint:
          xlim: [-150, 150]
          ylim: [-300, -60]
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [-100, 95]            # (supersedes prior [-150, 150] single-session estimate)
          ylim: [100, 330]            # (supersedes prior [120, 360])
    jaw:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "gnuplot2"
      per_center_mode:
        nose:
          xlim: [-400, 300]
          ylim: [-30, 300]
        spout_midpoint:
          xlim: [-400, 300]
          ylim: [-220, 110]
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad,
          xlim: [-80, 80]             # clamped to legacy x_range filter [-80, 80] (from
          ylim: [195, 520]            # 20251117_DLC_analysis_jaw.ipynb X_MIN,X_MAX = -80,80).
          x_range: [-80, 80]          # Pre-histogram filter: drops DLC mis-detections far
                                      # from the midline. Phase 4.5-lite plumbs this into
                                      # build_histogram/plot_heatmap via the center_mode kwarg.
    tongue:
      likelihood_threshold: 0.70
      center_mode: spout_midpoint # Phase 4.5-lite: anatomically spout-anchored; sweep confirms
      cmap: "jet"
      per_center_mode:
        nose:
          xlim: [-420, 420]
          ylim: [-300, 310]
        spout_midpoint:               # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad,
          xlim: [-175, 175]           # clamped to legacy x_range filter [-175, 175] (from
          ylim: [-235, 225]           # 20260323_DLC_build-parquet_reward-aligned X_MIN,X_MAX=-175,175).
          x_range: [-175, 175]        # Pre-histogram filter: drops DLC mis-detections
                                      # (picket-fence pattern spanning ±600 px otherwise).
        eye_midpoint:
          xlim: [-420, 420]
          ylim: [-70, 540]
    L_whiskers_1:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "plasma"
      per_center_mode:
        nose:
          xlim: [-380, 220]
          ylim: [-150, 80]
        spout_midpoint: null  # Phase 6+ will fill in
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [15, 135]
          ylim: [55, 250]
    L_whiskers_2:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "inferno"
      per_center_mode:
        nose: null
        spout_midpoint: null
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [15, 165]
          ylim: [145, 355]
    L_whiskers_3:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "viridis"
      per_center_mode:
        nose: null
        spout_midpoint: null
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [60, 165]
          ylim: [75, 270]
    R_whiskers_1:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "plasma"
      per_center_mode:
        nose: null
        spout_midpoint: null
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [-140, -15]
          ylim: [70, 235]
    R_whiskers_2:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "inferno"
      per_center_mode:
        nose: null
        spout_midpoint: null
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [-165, 0]
          ylim: [155, 350]
    R_whiskers_3:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "viridis"
      per_center_mode:
        nose: null
        spout_midpoint: null
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [-185, -40]
          ylim: [95, 265]
    # Fiducial bodyparts — null-baseline controls for Phase 9 significance testing
    # (DECISIONS 2026-04-19 Phase 4.5-lite §Constraints). Each fiducial is centered
    # under its own regime. No cmap / per_center_mode: no heatmaps for fiducials today.
    L_eye:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint
    R_eye:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint
    L_spout:
      likelihood_threshold: 0.80
      center_mode: spout_midpoint
    R_spout:
      likelihood_threshold: 0.80
      center_mode: spout_midpoint

# ---- DLC spatial (reward-aligned) ----
# Per-bodypart reward-aligned config. Tongue has legacy values from
# 20260323 cell 16. All others are sanity-check-only defaults —
# first reward-aligned runs require visual inspection.

dlc_spatial_reward_aligned:
  reward_windows_ms:
    - [-500, 5000]
    - [-100, 1000]
  trial_groups: ["all", "L", "R"]
  default_nbins: [80, 80]
  fig_dpi: 200
  norm_mode: "log"
  vmin_log_prop: 1.0e-5
  share_xy_within_mouse: true
  fps: 250.0
  bodyparts:
    tongue:
      likelihood_thresholds: [0.5, 0.7]
      x_range: [-150, 150]
      parity_status: "legacy-ported"
    jaw:
      likelihood_thresholds: [0.5]
      x_range: null
      parity_status: "sanity-check-only"
    nose:
      likelihood_thresholds: [0.7]
      x_range: null
      parity_status: "sanity-check-only"
    L_whiskers_1:
      likelihood_thresholds: [0.8]
      x_range: null
      parity_status: "sanity-check-only"
    L_whiskers_2:
      likelihood_thresholds: [0.8]
      x_range: null
      parity_status: "sanity-check-only"
    L_whiskers_3:
      likelihood_thresholds: [0.8]
      x_range: null
      parity_status: "sanity-check-only"
    R_whiskers_1:
      likelihood_thresholds: [0.8]
      x_range: null
      parity_status: "sanity-check-only"
    R_whiskers_2:
      likelihood_thresholds: [0.8]
      x_range: null
      parity_status: "sanity-check-only"
    R_whiskers_3:
      likelihood_thresholds: [0.8]
      x_range: null
      parity_status: "sanity-check-only"

# ---- Wavesurfer ----

wavesurfer:
  sample_rate_hz: 1000

# ---- DLC (to be filled in later phases) ----

dlc:
  likelihood_threshold: null
  bodyparts:
    - medial_edge_L_eye
    - medial_edge_R_eye
    - nose
    - whisker_L1
    - whisker_L2
    - whisker_L3
    - whisker_R1
    - whisker_R2
    - whisker_R3
    - jaw
    - tongue
    - spout_L
    - spout_R

# ---- Reward window (DLC spatial, to be filled in later phases) ----

reward_window:
  start_ms: 0
  end_ms: 8000

pixel_bins:
  bin_size_px: null

# ---- DLC inference on O2 (standalone tool) ----

dlc_inference_o2:
  # SBATCH resources
  partition: "gpu"
  gres: "gpu:1"
  cpus_per_task: 10
  mem: "30G"
  time: "9:30:00"
  exclude_nodes: "compute-g-16-[254-255]"
  conda_module: "conda/miniforge3/24.11.3-0"
  conda_env: "deeplabcut"
  # DLC parameters
  shuffle: 5
  trainingsetindex: 0
  gputouse: 0
  batchsize: 1
  allow_growth: true
  video_glob: "video2_*.avi"
  # O2 paths (user-specific parts templated with {username})
  scratch_root: "/n/scratch/users/{username_initial}/{username}"
  camera_source: "/n/files/Neurobio/MICROSCOPE/Rich/data/2pRAM/facerhythm_stroke_biomarker_exp/camera"
  dlc_config_source: "/n/files/Neurobio/MICROSCOPE/Priya/DeepLabCut/DLC_train_config"
  data1_staging: "/n/data1/hms/neurobio/sabatini/Priya/DeepLabCut/O2_staging"
  microscope_dest: "/n/files/Neurobio/MICROSCOPE/Priya/DeepLabCut/O2_analysis"
  transfer_host: "transfer.rc.hms.harvard.edu"
  # Snapshot renaming
  snapshot_renames:
    "snapshot-best-60": "snapshot_060"
    "snapshot_best-60": "snapshot_060"
