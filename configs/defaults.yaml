# Default analysis parameters (cohort-wide).
# Per-session overrides live in configs/session_overrides.yaml.
# Modules load these via stroke_orofacial config utilities.
# Override per-notebook in the USER INPUTS cell.
#
# Authoritative source: params dict from legacy canonical notebook
# batch_process_20260410PS.ipynb (Rule 1: latest YYYYMMDD).

# ---- Wavesurfer read-time behavior ----
# Phase 8a.10.1 (2026-05-14): the raw .h5 channel labels emitted by the
# rig are inverted cohort-wide — what's labeled `Reward_*` carries ~200 ms
# pulses (auditory tone TTL); what's labeled `Tone_*` carries ~26 ms
# pulses (reward solenoid drive). Cohort-wide confirmed by Task 0.5
# pulse-width audit (271/271 sessions; see
# `.scratch_phase_8a_10_1/task_0_5_audit_report.md` and
# `docs/prompts/phase-8a.10.1-tone-reward-swap-fix-kickoff.md`).
#
# `tone_reward_swap_enabled: true` (default) applies an in-loader swap
# of the `Reward_<side>` ↔ `Tone_<side>` dict keys post-read in
# `load_wavesurfer_signals` so downstream code sees semantically-correct
# content under the canonical labels. Set to `false` only as a
# kill-switch for hypothetical future correctly-labeled cohorts.
wavesurfer:
  tone_reward_swap_enabled: true

# ---- Spout behavior processing ----

process_treadmill_signal:
  offset_in_volts: 1.2587643276652853
  voltSec_per_rot: 0.382
  mm_per_rot: 29.25
  sample_rate: 1000
  smoothing_sigma: 0.15

find_running_bouts:
  thresh_speed: 5
  max_gap_duration: 0.3
  min_duration: 2.0
  allow_licks: false
  min_lick_distance: 1.5

find_licks_and_rewards:
  lick_detection:
    thresh_upper: 2.5
    thresh_lower: 0.5
    duration_lockout_falling_edge: [0.001, 0.02]
  reward_detection:
    thresh: 0.5

find_grooming_bouts:
  amplitude_threshold_lick_detection: 2.5
  sign_threshold_lick_detection: -1
  duration_widen_conj_before: 0.020
  duration_widen_conj_after: 0.020
  duration_maxThresh_long: 0.400
  duration_widen_bad_before: 5.000
  duration_widen_bad_after: 5.000
  duration_minThresh_good: 10.000

find_quiet_bouts:
  speed_threshold: 1
  min_quiet_duration: 10
  treadmillSlow_time_buffer: [3, 3]
  lick_time_buffer: [1, 3]
  reward_time_buffer: [0.1, 8]
  groom_time_buffer: [6, 6]

find_peri_reward_periods:
  window_around_reward: [0, 6]

find_peri_reward_and_tone_periods:
  window_around_reward: [0, 6]

# ---- Spout-behavior endpoints v2 (Phase 8a) ----
# New endpoint suite consumed by Phase 8a's recovery-trajectory plots and
# the per-session `spout_endpoints.json` writer. Strictly additive:
# legacy `report.json` (written by Phase 2) is byte-stable.
# See docs/PHASE_8A_LEGACY_ENDPOINT_MAPPING.md for the evidence base and
# docs/prompts/phase-8a-spout-recovery-trajectories-kickoff.md for the
# full decision trail of the values below.

spout_behavior:
  endpoints:
    # Hierarchical pass-criteria from legacy behavior_report_PS.py, renamed
    # to descriptive slugs (Phase 8a scoping decision Q1, 2026-04-20).
    # Legacy → new bijective mapping. Consumers read the new slugs; the
    # legacy names appear only in this map and in the legacy report.json.
    criteria_slug_map:
      criteria_1: criteria_training_pass_consecutive_sessions
      criteria_2: criteria_session_trial_pass_fraction_above_threshold
      criteria_3: criteria_first_correct_lick_present
      criteria_4: criteria_correct_lick_count_threshold
    criteria:
      # C1: multi-session pass — last N sessions each have both sides C2-passing.
      training_pass_consecutive_sessions:
        num_consecutive_pass: 3
      # C2: per-session per-side pass fraction (over trials meeting C3∩C4).
      session_trial_pass_fraction_above_threshold:
        fraction_pass: 0.6
      # C3: per-trial, first correct-side lick within post-reward window.
      first_correct_lick_present:
        window_seconds: [0.0, 2.0]
      # C4: per-trial correct/incorrect lick-count thresholds in post-reward window.
      correct_lick_count_threshold:
        window_seconds: [0.0, 2.5]
        num_licks_correct_min: 5
        num_licks_incorrect_max: 0
    # Q9 new endpoints.
    lick_bouts:
      max_ili_ms: 300           # (Phase 8a Q3 override of typical ~250 ms default)
      min_bout_licks: 2
      report_bout_count_distribution: true  # per-session std + histogram array
    within_session_learning_curve:
      n_bins: 5                 # ordinal trial-position bins
    within_session_change:
      detrend_method: linear    # linear | loess | theil_sen (Phase 9 may refine)
    inter_session_persistence:
      lag: 1                    # session-lag for autocorrelation
    switch_cost:
      same_side_baseline_definition: immediately_prior_trial
    # Engagement extras (Phase 8a §8a.6): not in the Q9 list but cheap + useful.
    engagement:
      compute_tone_trial_count_per_session: true
      compute_inter_trial_interval_distribution: true
    # Legacy A11 window promoted from hardcode to config (Q4, 2026-04-20).
    late_lickiness:
      window_seconds: [8.0, 60.0]
    # Prototype phenotype classifier (Q5, 2026-04-20). Flagged non-production;
    # Phase 9.1 will supersede with a real classifier.
    phenotype_prototype:
      k: 3
      metric: first_lick_accuracy_slope_day_7_to_21
      labels: [fast_recoverer, slow_recoverer, non_recoverer]
      enabled: true

# ---- Alignment ----

alignment:
  csv_idx_sync: 2          # column index in camera CSV for sync signal
  csv_idx_time: 0          # column index in camera CSV for frame tick counter
  key_sync: "Sync_signal"  # wavesurfer channel name for sync signal
  fps_cam: 250.0           # camera frame rate (Hz)
  edge_threshold: 0.5      # rising-edge threshold on normalized [0,1] scale
  normalize_p_lo: 5        # robust percentile for min-max normalization
  normalize_p_hi: 95       # robust percentile for min-max normalization
  window: 20               # edge-sequence matching window size
  p: 0.1                   # L-p norm exponent for matching
  min_matched_edges: 5     # minimum matched edges for valid alignment
  cam_idx: 2               # which camera to align (cam2 = DLC camera)

# ---- DLC centering ----

dlc_centering:
  likelihood_threshold: 0.7   # used ONLY for computing center, NOT for dropping rows
  default_mode: "nose"        # ultimate fallback only; per-bodypart defaults under
                              # dlc_spatial.bodyparts.{bp}.center_mode are the primary
                              # source (added in Phase 4.5-lite, 2026-04-20)
  compression: "zstd"         # parquet compression

# ---- DLC spatial analyses ----
# Per-(bodypart, center_mode) plotting parameters per DECISIONS.md
# "Phase 5+ downstream analyses: preserve per-(bodypart, center_mode) plotting parameters"

dlc_spatial:
  heatmap_nbins: 100              # fine-resolution grid for per-session heatmap viz
  target_bin_size_x: 25.0         # coarser stats grid: nx = round(span_x / bin_size), min 5
  target_bin_size_y: 25.0         # coarser stats grid: ny = round(span_y / bin_size), min 5
  apply_x_range: false            # DEPRECATED fallback (Phase 4.5-lite): use
  x_range: [-200, 200]            # bodyparts.{bp}.per_center_mode.{mode}.x_range instead.
  save_dpi: 200                   # PNG save resolution
  # Per-(bodypart, center_mode) axis limits.
  # Derived from PS46/20250307 data ranges with ~25% margin.
  # Limits set to null are not yet validated — Phase 6+ will fill in
  # when tone-aligned analyses are tested on those combinations.
  bodyparts:
    nose:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "gist_ncar"
      per_center_mode:
        nose:
          xlim: [-150, 150]
          ylim: [-120, 130]
        spout_midpoint:
          xlim: [-150, 150]
          ylim: [-300, -60]
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [-100, 95]            # (supersedes prior [-150, 150] single-session estimate)
          ylim: [100, 330]            # (supersedes prior [120, 360])
    jaw:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "gnuplot2"
      per_center_mode:
        nose:
          xlim: [-400, 300]
          ylim: [-30, 300]
        spout_midpoint:
          xlim: [-400, 300]
          ylim: [-220, 110]
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad,
          xlim: [-80, 80]             # clamped to legacy x_range filter [-80, 80] (from
          ylim: [195, 520]            # 20251117_DLC_analysis_jaw.ipynb X_MIN,X_MAX = -80,80).
          x_range: [-80, 80]          # Pre-histogram filter: drops DLC mis-detections far
                                      # from the midline. Phase 4.5-lite plumbs this into
                                      # build_histogram/plot_heatmap via the center_mode kwarg.
    tongue:
      likelihood_threshold: 0.70
      center_mode: spout_midpoint # Phase 4.5-lite: anatomically spout-anchored; sweep confirms
      cmap: "jet"
      per_center_mode:
        nose:
          xlim: [-420, 420]
          ylim: [-300, 310]
        spout_midpoint:               # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad,
          xlim: [-175, 175]           # clamped to legacy x_range filter [-175, 175] (from
          ylim: [-235, 225]           # 20260323_DLC_build-parquet_reward-aligned X_MIN,X_MAX=-175,175).
          x_range: [-175, 175]        # Pre-histogram filter: drops DLC mis-detections
                                      # (picket-fence pattern spanning ±600 px otherwise).
        eye_midpoint:
          xlim: [-420, 420]
          ylim: [-70, 540]
    L_whiskers_1:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "plasma"
      per_center_mode:
        nose:
          xlim: [-380, 220]
          ylim: [-150, 80]
        spout_midpoint: null  # Phase 6+ will fill in
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [15, 135]
          ylim: [55, 250]
    L_whiskers_2:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "inferno"
      per_center_mode:
        nose: null
        spout_midpoint: null
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [15, 165]
          ylim: [145, 355]
    L_whiskers_3:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "viridis"
      per_center_mode:
        nose: null
        spout_midpoint: null
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [60, 165]
          ylim: [75, 270]
    R_whiskers_1:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "plasma"
      per_center_mode:
        nose: null
        spout_midpoint: null
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [-140, -15]
          ylim: [70, 235]
    R_whiskers_2:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "inferno"
      per_center_mode:
        nose: null
        spout_midpoint: null
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [-165, 0]
          ylim: [155, 350]
    R_whiskers_3:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint   # Phase 4.5-lite: sweep winner for face-anchored bodyparts
      cmap: "viridis"
      per_center_mode:
        nose: null
        spout_midpoint: null
        eye_midpoint:                 # Phase 4.5-lite: cohort-pooled q00001_9999 + 40% pad
          xlim: [-185, -40]
          ylim: [95, 265]
    # Fiducial bodyparts — null-baseline controls for Phase 9 significance testing
    # (DECISIONS 2026-04-19 Phase 4.5-lite §Constraints). Each fiducial is centered
    # under its own regime.
    #
    # Phase 7c.2 Addendum #13 (2026-05-15) extends these entries with cmap +
    # per_center_mode blocks for the two new composite-family heatmaps
    # (``spout_spout_midpoint`` = {L_spout, R_spout}@spout_midpoint, and
    # ``eye_eye_midpoint`` = {L_eye, R_eye}@eye_midpoint). cmaps: "Reds" for
    # L, "Blues" for R — bilateral pairs with clear L/R visual contrast.
    # per_center_mode.xlim/ylim values are UNIFIED bilateral ranges (cover
    # both L and R bodyparts) so the composite axis lookup (which keys on
    # the first bp per legacy whiskers convention) renders both bilateral
    # bodyparts visibly. Tight ~3-6 px DLC clusters (estimated from PS46/
    # 2025-03-07; see .scratch_phase_7c2/estimate_fiducial_ranges.py output)
    # get generous padding (~±20 px on Y, full bilateral span on X) for
    # plot readability.
    L_eye:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint
      cmap: "Reds"
      per_center_mode:
        eye_midpoint:
          xlim: [-160, 160]
          ylim: [-20, 20]
    R_eye:
      likelihood_threshold: 0.80
      center_mode: eye_midpoint
      cmap: "Blues"
      per_center_mode:
        eye_midpoint:
          xlim: [-160, 160]
          ylim: [-20, 20]
    L_spout:
      likelihood_threshold: 0.80
      center_mode: spout_midpoint
      cmap: "Reds"
      per_center_mode:
        spout_midpoint:
          xlim: [-100, 100]
          ylim: [-20, 20]
    R_spout:
      likelihood_threshold: 0.80
      center_mode: spout_midpoint
      cmap: "Blues"
      per_center_mode:
        spout_midpoint:
          xlim: [-100, 100]
          ylim: [-20, 20]

# ---- DLC spatial (tone-aligned) ----
# Per-family tone-aligned config — Phase 7c.2 Addendum #3 Q10.A.
#
# Schema restructured 2026-05-15: the prior `bodyparts:` flat per-bodypart
# block (which implicitly allowed all bodypart × center_mode combinations)
# is replaced by a `families:` allowlist. Each family entry pins explicit
# (bodyparts, center_mode) pairs, scoped tighter than the Phase 4.5-lite
# sweep covered. Out-of-allowlist combinations (e.g., jaw_spout_midpoint,
# nose_spout_midpoint) are explicitly removed. ``config_loader``
# validates the loaded structure against the locked 7-family allowlist
# at load time; out-of-allowlist combos raise at YAML-load.
#
# Yields 14 heatmaps per (trial_group, window, session):
#   tongue_spout_midpoint = 1
#   tongue_eye_midpoint = 1
#   jaw_eye_midpoint = 1
#   nose_eye_midpoint = 1
#   whiskers_eye_midpoint = 6 (one per individual whisker; no aggregation)
#   spout_spout_midpoint = 2 (L_spout + R_spout; layered composite — Add. #13)
#   eye_eye_midpoint = 2 (L_eye + R_eye; layered composite — Add. #13)
#
# Per Phase 7c.2 Addendum #3 Interpretation 1 lock, this config drives
# compute-on-demand tone-aligned rendering (Task 5 ``render_tone_aligned_heatmap``
# wrapper). NO cached NPZ tree emission by default — the cohort re-emit
# driver in scripts/phase_7c2/reemit_cohort.py drops Category A entirely.
# ``build_tone_aligned_analysis(emit_cache=True)`` is the opt-in escape
# hatch for notebook 12 / one-off inspection cases that still want the
# NPZ on disk.
#
# History: YAML key renamed from ``dlc_spatial_reward_aligned`` in
# Phase 7b-light per Q7 hard rename; per-bodypart -> per-family restructure
# in Phase 7c.2 Task 2.5 per Q10.A.

dlc_spatial_tone_aligned:
  tone_windows_ms:
    - [-500, 5000]
    - [-100, 1000]
  trial_groups: ["all", "L", "R"]
  default_nbins: [80, 80]
  fig_dpi: 200
  norm_mode: "log"
  vmin_log_prop: 1.0e-5
  share_xy_within_mouse: true
  fps: 250.0
  # Phase 7c.2 Addendum #15 Q15: UOT spatial resolution decoupled from
  # heatmap_nbins. Legacy renderer (cells 6300-6680 of
  # 20251202_DLC_analysis_all_bodyparts_stats_pixelbin.ipynb, line 6434)
  # uses NBINS = 50 — pinned here as the cohort default. Reduces arrow
  # count from O(100²) to O(50²) keeping the displacement field readable.
  # Other plot types continue to use default_nbins (heatmap resolution).
  unbalanced_ot:
    nbins: 50
  families:
    tongue_spout_midpoint:
      bodyparts: ["tongue"]
      center_mode: "spout_midpoint"
      likelihood_thresholds: [0.5, 0.7]
      x_range: [-150, 150]
      parity_status: "legacy-ported"
    tongue_eye_midpoint:
      bodyparts: ["tongue"]
      center_mode: "eye_midpoint"
      likelihood_thresholds: [0.5, 0.7]
      x_range: null
      parity_status: "sanity-check-only"
    jaw_eye_midpoint:
      bodyparts: ["jaw"]
      center_mode: "eye_midpoint"
      likelihood_thresholds: [0.5]
      x_range: null
      parity_status: "sanity-check-only"
    nose_eye_midpoint:
      bodyparts: ["nose"]
      center_mode: "eye_midpoint"
      likelihood_thresholds: [0.7]
      x_range: null
      parity_status: "sanity-check-only"
    whiskers_eye_midpoint:
      # One heatmap per individual whisker bodypart — no aggregation.
      # Six entries fan out at the render layer; lookup_tone_family
      # returns this family entry for each (whisker_bp, eye_midpoint) probe.
      bodyparts: ["L_whiskers_1", "L_whiskers_2", "L_whiskers_3",
                  "R_whiskers_1", "R_whiskers_2", "R_whiskers_3"]
      center_mode: "eye_midpoint"
      likelihood_thresholds: [0.8]
      x_range: null
      parity_status: "sanity-check-only"
    # Phase 7c.2 Addendum #13 (2026-05-15) — fiducial bilateral-pair
    # composites. Pair the L/R fiducial bodyparts under their respective
    # self-anchored center modes. Same Pattern B layered-overlay treatment
    # as whiskers (per-bp cmap from dlc_spatial.bodyparts.{bp}.cmap;
    # composite axis = first-bp's per_center_mode block).
    spout_spout_midpoint:
      bodyparts: ["L_spout", "R_spout"]
      center_mode: "spout_midpoint"
      likelihood_thresholds: [0.8]
      x_range: null
      parity_status: "sanity-check-only"
    eye_eye_midpoint:
      bodyparts: ["L_eye", "R_eye"]
      center_mode: "eye_midpoint"
      likelihood_thresholds: [0.8]
      x_range: null
      parity_status: "sanity-check-only"

# ---- DLC kinematics (Phase 7a.2) ----
# Bodypart-parametric constants for the v5p3 interpolation pipeline.
# Ported from tongue Cell 23 + jaw Cell 22 of the canonical notebooks
# (see docs/legacy_snippets/ for the vendored source).
#
# Per-animal (X0, Y0) baselines live in configs/animals.yaml under each
# animal's kinematics_baselines: block (seeded PR #81, Phase 7a.1). This
# block carries only bodypart-parametric constants, not per-animal ones.
#
# DO NOT change interpolation_method or interpolation_fallback without
# a DECISIONS entry — see 2026-04-22 Knob-2 resolution in
# docs/phase-7/interpolation-strategy.md §10.

dlc_kinematics:
  interpolation_version: v5p3
  interpolation_method: pchip
  interpolation_fallback: linear
  tongue:
    center_mode: centered_spout_midpoint
    interpolation:
      x_range_pm: 150.0
      x_range_source: lk          # keep "lk" for port parity (Knob 4)
      lk_thr: 0.5
      n_neigh: 2
      neighbor_ms: 16.0
      max_gap_ms: 56.0
      interp_n_side: 6
      require_bracketed_by_hilk: true
    baseline:
      force: true
      y0_lk_thr: 0.95
      y0_percentile: 5.0
      x0: "median_of_y_percentile_subset"
  jaw:
    center_mode: centered_eye_midpoint
    interpolation:
      x_range_pm: 75.0
      x_range_source: lk
      lk_thr: 0.5
      n_neigh: 3
      neighbor_ms: 16.0
      max_gap_ms: 120.0
      interp_n_side: 6
      require_bracketed_by_hilk: true
    baseline:
      force: true
      y0_lk_thr: 0.95
      y0_percentile: 5.0
      x0: "median_of_y_percentile_subset"

  # Phase 7a.3 V3 — tongue per-trial features (Cells 33/36/39/42/50)
  tongue_pertrial:
    # =========================================================
    # Per-metric detection / apply windows (ms post-reward)
    # =========================================================
    lick12_detect_win_ms: [70, 3000]
    peak_velocity_detect_win_ms: [70, 3000]
    lick_count_detect_win_ms: [70, 8000]
    lick_count_apply_win_ms: [70, 5000]
    lick_count_bin_win_ms: [70, 5070]   # 5 × 1-s clean bins
    licking_dyn_detect_win_ms: [70, 8000]
    licking_dyn_apply_win_ms: [70, 5000]
    angle_detect_win_ms: [70, 8000]
    angle_apply_win_ms: [70, 5000]

    # =========================================================
    # Shared lick-detector knobs (applied uniformly across all 5 cells)
    # =========================================================
    detector:
      slope_thr_px_per_s: 250.0
      rise_min_ms: 16.0
      fall_min_ms: 16.0
      peak_pad_ms: 52.0
      min_peak_y_abs: 20.0
      min_finite_samples_per_lick: 5
      strict_no_fallback: true
      # C5.5 (2026-04-29): under strict_no_fallback=True, the detector
      # normally rejects peaks with no fall run after the apex (Cell 33
      # legacy behavior). Setting accept_peaks_without_fall_run=True
      # accepts such peaks anyway (Cells 36/39/42 legacy behavior). Default
      # False = Cell 33-strict, V3 design intent.
      accept_peaks_without_fall_run: false
      use_src: "final"
      do_smooth_y_for_detection: true
      smooth_ms_detect_y: 12.0
      do_smooth_vel: true
      smooth_ms_vel: 12.0

    # =========================================================
    # Per-cell detector knob overrides (C5.2 2026-04-28)
    # =========================================================
    # The shared `detector:` block above is the V3 default for every cell.
    # Legacy had per-cell-different knob values (e.g. Cell 33 had
    # MIN_PEAK_Y_ABS=20 pre-existing while Cells 36/39/42 lacked it; Cell
    # 36 had MIN_FINITE_SAMPLES_PER_LICK=5 pre-existing while Cells 33/
    # 39/42 lacked it). The parity harness uses this block in
    # `legacy_approximate` mode to recover bit-identical legacy semantics
    # by setting per-cell overrides (shallow merge on top of the shared
    # `detector:` dict) without disturbing default-mode behavior.
    #
    # In default mode every per-cell entry is empty → behavior unchanged.
    # =========================================================
    detector_per_cell:
      cell33: {}
      cell36: {}
      cell39: {}
      cell42: {}
      cell50: {}

    # =========================================================
    # Bout configuration
    # =========================================================
    bout:
      max_ili_ms: 300.0
      min_ili_ms: 80.0
      single_bout_win_ms: [-120, 200]
      min_licks_in_bout_for_ili: 3
      allow_single_lick_bouts: true

    # =========================================================
    # Per-cell bout knob overrides (C5.2 2026-04-28)
    # Same shape as detector_per_cell. Cell 42 legacy used
    # bout_max_ili=400 while V3 unified to 300; the harness sets the
    # legacy value here in `legacy_approximate` mode for Cell 42 only.
    # =========================================================
    bout_per_cell:
      cell33: {}
      cell36: {}
      cell39: {}
      cell42: {}
      cell50: {}

    # =========================================================
    # Per-metric bout mode (Q8 correction 2026-04-28)
    # Modes: "all" | "first_bout" | "first_multi_bout"
    # The mode declares the peak-set filter applied BEFORE the metric is
    # computed. Metrics that operate on the whole apply-window peak set
    # (counts, rates) use "all"; metrics that operate on a specific bout's
    # peaks (within-bout ILI, lick count inside the first multi-lick bout)
    # use "first_multi_bout".
    # =========================================================
    bout_mode:
      lick12: "all"
      peak_velocity: "all"
      n_licks: "all"
      licking_dynamics_traces: "all"
      licking_dynamics_bout_count: "all"   # Q8: was "first_multi_bout" — wrong; bout_count tallies multi-lick bouts across the whole apply-window peak set, not a peak-set filter.
      licking_dynamics_mean_within_bout_ili: "first_multi_bout"
      licking_dynamics_lick_rate: "all"
      angle_n_peaks: "all"
      angle_n_bouts: "all"
      angle_n_multi_lick_bouts: "first_multi_bout"
      angle_first_peak_t_ms: "all"
      angle_n_licks_in_first_multi_bout: "first_multi_bout"   # Q9 NEW 2026-04-28 (placement realigned to Cell 50 own-bout per kickoff §3a): peak count inside the first multi-lick bout. Feeds session_inclusion.n_phase_licks (sum across trials).

    # =========================================================
    # Cell 39 — direction tally + categorical + binning
    # =========================================================
    direction_thresholds:
      x_left_thr_px: 5.0
      x_right_thr_px: -5.0
    n_licks_categorical:
      lick_ge10_thr: 10
    n_licks_binning:
      bin_count: 5
      bin_ms: 1000.0
    max_licks_per_trial: 40

    # =========================================================
    # Cell 42 — licking dynamics trace emission
    # =========================================================
    licking_dynamics:
      bin_ms: 20.0
      lickrate_smooth_sigma_ms: 50.0
      ili_smooth_sigma_ms: 50.0
      prob_smooth_movavg_ms: 200.0
      min_trials_per_bin: 3
      max_licks_per_trial: 80

    # =========================================================
    # Cell 50 — angle math
    # =========================================================
    angle:
      sign_flip: -1.0
      smoothing_gaussian_sigma_ms: 8.0
      eye_likelihood_threshold: 0.70
      min_valid_eye_frames: 100
      allow_one_eye_fallback: true
      eye_landmark_source: "consolidated_centered_spout_midpoint"
      # Spout-frame sanity check (Task 1.5 finding 2026-04-28).
      # Input parquet has no center_mode metadata, so we verify empirically:
      # |0.5 * (median(L_spout_*) + median(R_spout_*))| must be <= this on
      # both x and y, else raise (fail loud rather than silently emit
      # angles in the wrong frame).
      spout_frame_origin_tol_px: 2.0

    # =========================================================
    # Cell 50 — session-level inclusion thresholds
    # (replaces V1/V2's per-trial tongue_angle_pass mask)
    # =========================================================
    session_inclusion:
      min_time_trials_per_session: 0
      min_firstpeak_trials_per_session: 5
      min_phase_licks_per_session: 15
      min_phase_trials_per_session: 5

    # =========================================================
    # Cell 50 — phase machinery
    # =========================================================
    phase:
      n_phase_bins: 72
      phase_summary_mode: "first_multi_bout"

    # =========================================================
    # Output schema versions (baked into parquet/JSON metadata)
    # =========================================================
    feature_extraction_version: "v7a.3"
    interpolation_version: "v5p3"

    # =========================================================
    # Day-binned cross-session aggregation (Phase 7a.4)
    # =========================================================
    # Aggregates the per-session × side licking-dynamics traces parquet
    # (the 7a.3 V3 emit) across sessions in each (side, rel_day_bin)
    # group, where rel_day_bin width is the per-animal `bin_days` value
    # in configs/animals.yaml. Algorithm anchors on rel_day=0 (last
    # pre-stroke session); last pre-bin is [-(B-1), 0]; post bins start
    # at [1, B]; labels are f"{lo}..{hi}" matching legacy convention.
    #
    # Legacy Cell 42 has no per-aggregator filter (no min_sessions_per_bin):
    # any (side, rel_day_bin) with >= 1 contributing session is emitted.
    # The session-level `min_trials_per_bin: 3` filter (above) is applied
    # at session-traces construction and is already baked into the input
    # `ili_within_bout_rate_per_t` column — re-applying it here would
    # double-filter.
    day_binned:
      # Across-session aggregation function. Legacy uses np.nanmean +
      # nanstd/sqrt(n_sess) for SEM. Only "mean" is honoured today;
      # placeholder for future "median" support.
      aggregation_function: "mean"
      # Emit SEM column alongside the mean (legacy emits both).
      emit_sem: true
      # Emit a per-timebin n_support_sessions column (count of sessions
      # contributing finite values at each bin) — legacy emits this.
      emit_n_support_sessions: true

  # =========================================================
  # Tongue visual gate rendering (Phase 7a.4)
  # =========================================================
  # Cell 50 plot families (port at Phase 7a.4): renders 6 PNGs per
  # session (Family 1 emits per-side, families 2-5 emit one PNG each).
  # Consumes an in-memory TongueVisualBundle from build_tongue_visual_bundle
  # (additive helper on tongue_pertrial.py — see Phase 7a.4 Task 3.5).
  # Detector / bout / angle constants are sourced from the
  # `tongue_pertrial:` block above (single source of truth); this block
  # carries only knobs unique to the visual gate.
  tongue_visual:
    # Snippet windows for the in-memory bundle helper. These differ from
    # the 7a.3 metric-detection windows (which start at 70 ms post-reward
    # to skip the reward-delivery transient) — Cell 50 plots include the
    # pre-detection window (0-70 ms) for visual context.
    #
    # Phase 7a.4-cross-session-angle (2026-05-04, Addendum #4): widened
    # plot_win_ms left edge from 0.0 to -180.0 to share the per-session
    # and cross-session tone-aligned plot window with the
    # first_peak_align_win_ms left edge for visual symmetry across both
    # pre-tone families. Display clipping to the narrow [-180, 1000]
    # ms tone-aligned view is applied at render time via
    # tone_aligned_display_window_ms below; the bundle data itself
    # extends to 8000 ms so qc_trials retains its full post-tone
    # context. Detector + first-peak-align windows are independent of
    # plot_win_ms and unaffected.
    bundle:
      plot_win_ms: [-180.0, 8000.0]
      detect_win_ms: [70.0, 3000.0]
      first_peak_align_win_ms: [-180.0, 1000.0]

    # Tone-aligned display window (Phase 7a.4-cross-session-angle,
    # 2026-05-04, Addendum #4). Per-session ``_plot_tone_aligned``
    # and the cross-session tone-aligned plots both clip the
    # rendered x-axis to this range despite the underlying bundle's
    # wider plot_win_ms. Single source of truth for the tone-aligned
    # display window — both per-session and cross-session readers
    # consume this knob.
    tone_aligned_display_window_ms: [-180.0, 1000.0]

    # Number of consecutive licks shown in the parameterized
    # first-N-licks phase-aligned-angle plot (Phase
    # 7a.4-cross-session-angle Addendum #11 Part A, 2026-05-04). The
    # plot emits ``phase_aligned_angle_first_{N}_licks.png`` per
    # (animal, date) showing peak[0]..peak[N-1] each centered in its
    # own [i, i+1] phase cycle (peak[i] at x=i+0.5; cycle width =
    # peak[i+1] - peak[i]). N=2 (default) directly visualizes the
    # warming-up first-vs-second-lick angle phenotype that motivated
    # the centered-phase convention. Configurable to any integer
    # ≥ 2; N=1 is degenerate — use ``_1st_lick`` plot instead.
    phase_aligned_first_n_peaks: 2

    # Phase-aligned-angle plot cycle-width source (Phase
    # 7a.4-cross-session-angle Addendum #15, 2026-05-04; supersedes
    # the Addendum #12 ``phase_aligned_isolated_lick_handling`` knob).
    # Choices:
    #   "synthetic_only" (default; Addendum #14b verdict winner —
    #     Mode 3 won across all three centered-phase families on
    #     PS46 / PS50 / PS55): every peak's cycle width =
    #     per-animal pre-stroke median ILI (from
    #     bundle.metadata["pre_stroke_median_ili_ms"], populated by
    #     :func:`build_tongue_visual_bundle_by_animal_date`).
    #     Real-ILI lookup bypassed entirely. Eliminates per-cycle
    #     width variance from the per-bin aggregation; remaining
    #     variance is the natural angle-shape variation across
    #     trials (the science of interest).
    #   "hybrid": real ILI from same-bout adjacency where available;
    #     synthetic median as fallback for isolated peaks +
    #     last-peak-of-multi-bout. Was the production default
    #     between Addendum #12 and Addendum #14b verdict.
    #   "real_only": multi-bout-only legacy behaviour. Cycle width
    #     = same-bout forward neighbour difference; peaks without
    #     a same-bout forward neighbour DROPPED. Equivalent to the
    #     Addendum #12 ``"skip"`` shorthand. No isolated-lick or
    #     last-peak-of-multi-bout contribution.
    # NaN-fallback: when ``"synthetic_only"`` is requested but the
    # animal's pre-stroke median is non-finite (e.g., no pre-stroke
    # sessions on disk), the renderer silently degrades to
    # ``"real_only"`` rather than raising. Same defensive pattern
    # as the Addendum #12 NaN-fallback.
    phase_aligned_ili_source: "synthetic_only"

    # Render-time mode selectors.
    # time: "all_bouts" | "first_bout" | "first_multi"
    # phase / xy: "all_multi" | "first_multi"
    #
    # ``time_summary`` is INTENTIONALLY UNUSED as of Phase
    # 7a.4-cross-session-angle Addendum #8 (2026-05-04). The
    # reward-aligned plot now consumes ``angle_snip`` (the raw
    # per-frame tongue angle) directly, bypassing the bout-windowed
    # ``angle_*_snip`` arrays this knob would dispatch over. The
    # ``"all_bouts"`` value here is the residual default from
    # Addendum #6 (which itself flipped ``"first_multi"`` →
    # ``"all_bouts"`` to capture isolated licks via
    # ``single_bout_win_ms``); Addendum #8 superseded that intent by
    # using the unwindowed raw trace instead. Knob retained for
    # backward compatibility — any external script that reads it
    # gets the documented value, even though no in-repo consumer
    # remains. To remove the knob entirely, see DECISIONS for the
    # follow-up cleanup phase. Same documentation-only pattern as
    # ``allow_single_lick_bouts`` flagged at the Addendum #6 First
    # Check (no consume path; behavior hard-wired in
    # ``_detector._build_bouts``).
    #
    # ``phase_summary`` and ``xy_summary`` defaults remain
    # ``"first_multi"`` — phase + xy_by_phase plots stay multi-bout-only
    # per Addendum #5 Option α (phase requires ≥2 peaks; isolated licks
    # are absent from df_phase by construction). The per-session
    # phase-aligned-angle PNG is split into ``_1st_lick`` (mode
    # ``first_lick``, new selector) and ``_all_licks`` (mode
    # ``all_multi``) by the per-session driver dispatch — neither
    # consumes ``phase_summary`` directly, so the value is now only a
    # fallback for pre-Addendum-#3 callers.
    modes:
      time_summary: "all_bouts"
      phase_summary: "first_multi"
      xy_summary: "first_multi"

    # Render-time aggregation filters (NOT used by the bundle helper).
    # Family 4 (phase-aligned) drops phase bins with fewer than
    # min_phase_points_per_bin_single contributing samples; phase curve
    # is then optionally smoothed with a 1-bin circular Gaussian.
    render:
      min_phase_points_per_bin_single: 5
      do_smooth_phase_curve: true
      phase_curve_sigma_bins: 1.0

    # Figure layout. 200 dpi matches legacy FIG_DPI; figsize is per-family
    # in Cell 50 (varies). Defaults here are the most common values; each
    # plot family overrides as needed.
    figure:
      width_inches: 12.0
      height_inches: 8.0
      dpi: 200

    # Plot-family enable/disable + family-specific tweaks. Only
    # qc_trials and xy_by_phase carry non-trivial extra knobs; the other
    # 3 families take all their knobs from the bundle / modes / figure
    # blocks above.
    plot_families:
      qc_trials:
        enabled: true
        view_n_trials_per_side: 10   # legacy VIEW_N_TRIALS_PER_SIDE
        detect_alpha: 0.035          # legacy QC_DETECT_ALPHA
        bout_alpha: 0.012            # legacy QC_BOUT_ALPHA
        peak_size: 18                # legacy QC_PEAK_SIZE
      first_peak_aligned:
        enabled: true
      tone_aligned:
        enabled: true
      phase_aligned_angle:
        enabled: true
      xy_by_phase:
        enabled: true
        cmap: "twilight"
        scatter_size: 8              # legacy s=8
        scatter_alpha: 0.65

    # Per-side colours for L/R overlays. Legacy SIDE_COLORS dict.
    side_colors:
      L: "dodgerblue"
      R: "mediumvioletred"

    # Side-by-side legacy-vs-consolidated comparison grid (rendered by
    # tongue_visual.render_comparison_grid for the visual-gate parity
    # runner). cols=2 for legacy | consolidated; include_diff inserts a
    # per-pixel difference inset zoom if useful (off by default —
    # numerical drift is expected and is for human review).
    comparison_grid:
      cols: 2
      include_diff: false

  # =========================================================
  # Jaw per-trial features (Phase 7a.5 — extracted from Cell 53
  # inline-detection logic). Mirrors tongue_pertrial.py architecture
  # at smaller scale. Reusable building block for any future jaw-
  # related work (the 7a.3-jaw audit at PR #87 confirmed the JAW
  # NOTEBOOK has no per-trial features; the per-trial logic actually
  # lives inside the tongue notebook's mismatch classifier and is
  # extracted here as its own module).
  # =========================================================
  jaw_pertrial:
    detect_win_ms: [0, 5000]              # post-reward window for jaw deflection detection
    baseline_win_ms: [-500, 0]            # pre-reward baseline window for mean+sd
    deflection_threshold_sd_multiplier: 4.0   # |jaw_y - baseline| > 4 * baseline_sd
    deflection_threshold_min_px: 4.0          # OR > 4 px (whichever is larger)
    sustained_density_threshold: 0.625    # >= 5/8 frames over threshold (5/8 = 0.625)
    sustained_window_n_frames: 8          # rolling 8-frame window for the density check
    feature_extraction_version: "v7a.5"
    interpolation_version: "v5p3"

  # =========================================================
  # Tongue-jaw mismatch trial classifier + plotter (Phase 7a.5 —
  # Cell 53 classifier + Cell 55 plotter ports).
  #
  # Scientific rationale (Priya, 2026-04-30): post-stroke (bilateral)
  # lack of licking is NOT due to perceptual or motivational deficits.
  # Demonstrated by trials where the mouse shows post-cue jaw movement
  # WITHOUT licking — jaw motor system spared while tongue motor system
  # impaired. Mismatch trials are the primary positive evidence for
  # this dissociation, not just a QC gate.
  #
  # Per-trial decision: candidate_no_lick_with_jaw_move
  #   = quiet_tongue_pass AND jaw_pass_qc
  # See docs/legacy_snippets/tongue_jaw_mismatch.py (commit 4d34a8f)
  # for the verbatim Cell 53 source.
  # =========================================================

  # =========================================================
  # Tongue angle cohort (Phase 7a.4-cross-session-angle, 2026-05-04)
  # =========================================================
  # Per-mouse cross-session aggregations of the 6 per-session
  # tongue-angle plot families:
  #   - first_peak_aligned (mean ± SEM aligned to first detected peak)
  #   - reward_aligned (mean ± SEM aligned to reward; consumes
  #     angle_snip directly per Addendum #8)
  #   - phase_aligned_angle_1st_lick (centered-on-peak, single cycle)
  #   - phase_aligned_angle_all_licks (centered-on-peak, single cycle)
  #   - phase_aligned_angle_first_2_licks (centered-on-peak, multi-
  #     cycle per Addendum #11 Part A)
  #   - first_vs_second_peak_scatter (per-trial scatter of peak[0]
  #     angle vs peak[1] angle per Addendum #11 Part B)
  # × 2 sub-variants per family:
  #   - session_overlays: one curve/cloud per session per side,
  #     colored pre-stroke grey + post-stroke plasma by relative day
  #   - binned_overlays: one curve/centroid per (rel-day-bin, side),
  #     same colormap; bin width from animal_info.bin_days in
  #     configs/animals.yaml
  # = 12 PNGs per mouse, emitted to
  # ``<outputs>/dlc_kinematics/tongue_angle_cohort/{animal}/``.
  #
  # The cohort module reads the same per-session bundles as
  # ``tongue_visual`` (no separate compute path); per-animal
  # pre-stroke median ILI is sourced from
  # ``bundle.metadata["pre_stroke_median_ili_ms"]`` (populated by
  # :func:`build_tongue_visual_bundle_by_animal_date`).
  tongue_angle_cohort:
    # Curve / scatter visual styling. Phase 7a.4-cross-session-angle
    # Addendum #17 items 3+4 (2026-05-04): renamed alpha knobs to
    # ``alpha_mean`` / ``alpha_sem``; lowered defaults so overlapping
    # curves (≥50 sessions on PS55) read cleanly without one curve
    # dominating + SEM bands don't blur into a wall of color.
    visual:
      session_overlays:
        line_width: 1.5
        alpha_mean: 0.50      # was 0.85 pre-#17
        alpha_sem: 0.05       # was 0.10 pre-#17
      binned_overlays:
        line_width: 2.5
        alpha_mean: 0.70      # was 0.85 pre-#17
        alpha_sem: 0.10       # was 0.20 pre-#17
      # Scatter family styling (first_vs_second_peak_scatter, future
      # Cross-session #5).
      scatter:
        scatter_size: 18
        scatter_alpha: 0.55
        # Binned variant draws an ellipsoid per bin (mean ± 1 SD on
        # each axis); centroid marker on top of the ellipsoid.
        ellipsoid_alpha: 0.20
        centroid_size: 60

    # Pre-stroke / post-stroke colormap (mirrors
    # mean_sem_visual.mean_trace.pre_color / post_cmap):
    pre_color: "0.6"        # mid-grey for pre-stroke sessions / bins
    post_cmap: "plasma"     # colormap for post-stroke rel_day mapping

    # Min sessions required to render binned_overlays. Sessions with
    # rel_day < 0 always pool into a single "pre-stroke" bin; post-
    # stroke bins follow ``animal_info.bin_days`` (PS46-50: 2;
    # PS51/54/55: 7).
    min_sessions_per_bin: 1

    # Phase plot family inherits ``phase_aligned_first_n_peaks`` and
    # ``phase_aligned_ili_source`` from the per-session
    # ``dlc_kinematics.tongue_visual`` block (Addenda #11A + #15);
    # cross-session aggregator does not duplicate those knobs.

  tongue_jaw_mismatch:
    classifier:
      quiet_tongue_win_ms: [70, 5000]      # window for "zero detected tongue licks"
      # Tongue-side detector knobs MIRROR Cell 33 verbatim — no smoothing,
      # no MIN_FINITE filter (matches legacy mismatch classifier). These
      # are LOCAL to mismatch; do NOT pull from tongue_pertrial.detector
      # (which is a different shape per V3 — adds smooth_y / min_finite_
      # samples_per_lick / strict_no_fallback that the mismatch detector
      # never used).
      tongue_detector:
        slope_thr_px_per_s: 250.0
        rise_min_ms: 16.0
        fall_min_ms: 16.0
        min_peak_y_abs: 20.0
        peak_pad_ms: 52.0
        do_smooth_y_for_detection: false
    plotter:
      # Phase 7a.5 C6.2 (Priya 2026-05-01) port-fidelity round: every
      # numeric default below is the legacy Cell 55 value, sourced from
      # the vendored snippet at docs/legacy_snippets/tongue_jaw_mismatch.py.
      individual_trials:
        enabled: true
        n_cols: 2                          # legacy individualTrials2col
        figure_width_inches: 18.0          # legacy INDIVIDUAL_FIGSIZE[0]
        figure_height_inches: 12.0         # legacy INDIVIDUAL_FIGSIZE[1] — min height
        row_height_inches: 1.8             # legacy ROW_HEIGHT — height = max(figure_height_inches, row_height_inches * n_rows)
        dpi: 200                           # legacy FIG_DPI
        sort_by_side: true                 # Priya C6.1: L trials above R trials within each column
        shared_y_axis_per_plot_type_row: true   # NB: individual_trials columns are candidate/non-candidate, not L/R — knob has no effect today; reserved for layout variants that introduce L/R columns
      session_overlay_grid:
        enabled: true
        n_rows: 4
        n_cols: 2                          # legacy sessionOverlayGrid4x2
        figure_width_inches: 14.0          # legacy SESSION_GRID_FIGSIZE[0]
        figure_height_inches: 18.0         # legacy SESSION_GRID_FIGSIZE[1]
        hspace: 0.38                       # legacy fig.subplots_adjust(hspace=...)
        wspace: 0.22                       # legacy fig.subplots_adjust(wspace=...)
        # Phase 7a.5 C6.2 revised Fix 3: drop hardcoded jaw/tongue ranges.
        # Y-offset between jaw and tongue traces emerges naturally from
        # per-bodypart twin-axis auto-scaling. Per-row independence: row 3
        # (mean±SEM candidate) and row 4 (mean±SEM noncandidate) auto-
        # scale separately. Per-row shared-Y: L and R within the same
        # row use the union-padded range over both panels' data.
        shared_y_axis_per_plot_type_row: true
        mean_sem_axis:
          # Range computation matches legacy `_limits_from_rows` mode
          # "percentile_cap": clip data extremes by percentile + symmetric
          # pad. Both bodyparts use the same (max_pct, min_pct) pair on
          # twin axes, but each bodypart's auto-scaled range is computed
          # from its OWN data — so the natural offset is preserved.
          pad_fraction: 0.05               # legacy YLIM_PAD_FRAC
          percentile_cap_max: 99.9         # legacy JAW_YMAX_PERCENTILE
          percentile_cap_min: null         # legacy JAW_YMIN_PERCENTILE (None ⇒ raw min)
          # Faint individual-trial overlays under the mean±SEM band
          # (legacy SHOW_FAINT_TRIALS_IN_MEAN_SEM_OVERLAY=True). Z-order:
          # trial overlays plotted first, then mean line, then SEM fill.
          show_trial_overlays: true
          trial_overlay_jaw_alpha: 0.08    # legacy FAINT_TRIAL_JAW_ALPHA
          trial_overlay_tongue_alpha: 0.04 # legacy FAINT_TRIAL_TONGUE_ALPHA
          trial_overlay_jaw_linewidth: 0.8 # legacy FAINT_TRIAL_JAW_LW
          trial_overlay_tongue_linewidth: 0.7  # legacy FAINT_TRIAL_TONGUE_LW
      cross_session_overlay:
        enabled: true                      # per-mouse, all sessions
        figure_width_inches: 13.0          # legacy CROSS_SESSION_GRID_FIGSIZE[0]
        figure_height_inches: 8.5          # legacy CROSS_SESSION_GRID_FIGSIZE[1]
        hspace: 0.34                       # legacy
        wspace: 0.24                       # legacy
        # Legacy reserves the right 12% of the figure for the colorbar
        # via tight_layout(rect=[0, 0, 0.88, 0.98]) THEN adds the colorbar
        # at [0.90, 0.22, 0.015, 0.56]. Reproduce both calls.
        tight_layout_rect: [0.0, 0.0, 0.88, 0.98]
        shared_y_axis_per_plot_type_row: true  # L candidate ↔ R candidate share Y; same for noncandidate; rows independent
        include_colorbar: true             # right-side rel_day → color legend
        colorbar_rect: [0.90, 0.22, 0.015, 0.56]  # legacy _add_cross_session_colorbar
        colormap: "plasma"                 # legacy POSTSTROKE_CMAP_NAME
      cross_session_binned:
        enabled: true                      # per-mouse, day-binned (uses bin_days from animals.yaml)
        figure_width_inches: 13.0
        figure_height_inches: 8.5
        hspace: 0.34
        wspace: 0.24
        tight_layout_rect: [0.0, 0.0, 0.88, 0.98]
        shared_y_axis_per_plot_type_row: true
        include_colorbar: true
        colorbar_rect: [0.90, 0.22, 0.015, 0.56]
        colormap: "plasma"                 # match cross_session_overlay
    feature_extraction_version: "v7a.5"
    interpolation_version: "v5p3"

  # =========================================================
  # Phase 7a.6 — Mean/SEM visual gate (bodypart-parametric).
  # Vendored cells: docs/legacy_snippets/{tongue,jaw}_mean_sem_section.py.
  # Master cells (tongue 31 / jaw 30) audit (.scratch_7a6/AUDIT_REPORT.md
  # 2026-05-01): 33 of 34 KNOBS shared verbatim, only CENTER_MODE diverges.
  # Per-bodypart blocks below carry only the divergent value (+ jaw's
  # multi-bin extension that 7a.6 ports back to tongue per Q4).
  # Cells covered:
  #   - tongue 31 + jaw 30: master 4-plot-family per-session + cohort
  #     mean/SEM (individual_sessions / trial_overlays / session_overlays
  #     / binned_overlays).
  #   - tongue 45 / jaw 32: cross-session mean XY trajectory overlays
  #     (mean_xy_overlays plot family).
  #   - tongue 47+48 / jaw 34: cross-session mean XY video (consolidated
  #     into one with_frame_timestamps knob per Q5).
  # Task 4 (module port) extends this block with mean_trace + mean_video
  # sub-blocks once those cells are translated.
  # =========================================================
  mean_sem_visual:
    # ---- Plot-family enable/disable (master cells 31/30 PLOT_*) ----
    plot_individual_sessions: true
    plot_trial_overlays: true
    plot_session_overlays: true
    plot_binned_overlays: true

    # ---- PNG save toggles (master cells 31/30 SAVE_*_PNGS) ----
    save_pngs: true
    save_individual_pngs: true
    save_trial_overlay_pngs: true
    save_overlay_pngs: true
    save_binned_pngs: true

    # ---- Tone-aligned time windows (master cells 31/30 TIME_WINDOWS_MS;
    # renamed from `Reward-aligned` in Phase 7c.1 per Cat F YAML lockstep).
    # Each (pre_ms, post_ms) entry produces its own
    # `toneAligned_{pre}pre-{post}post/` subdir of saved figures (Q7
    # uniform layout for both bodyparts). Units: milliseconds. Legacy
    # outputs at `rewardAligned_*` directories remain on-disk through
    # Phase 7c.1 and are retired in Phase 7c.2 cohort completion.
    time_windows_ms:
      - [100, 1000]   # short window
      - [500, 5000]   # long window

    # ---- Stroke alignment + rel_day filtering (master cells 31/30
    # USE_STROKE_ALIGNMENT, PREPOST_MODE, REL_DAY_RANGE, INCLUDE_*_BINS).
    use_stroke_alignment: true
    prepost_mode: both        # "pre" | "post" | "both" | "all"
    rel_day_range: null       # null = no filter; OR [min_day, max_day]
    include_pre_bins: true
    include_post_bins: true

    # ---- Aesthetic / rendering knobs (master cells 31/30) ----
    plot_sem: true
    linewidth: 1
    sem_alpha: 0.18
    cmap_name: plasma
    line_alpha: 0.5
    pre_color: "0.3"
    side_colors:
      L: dodgerblue
      R: mediumvioletred

    # ---- Trial overlay knobs (master cells 31/30 TRIAL_*) ----
    trial_alpha: 0.08
    trial_linewidth: 0.6
    use_separate_trial_overlay_limits: true
    trial_overlay_percentiles: [1.0, 99.0]
    trial_overlay_pad_frac: 0.05

    # ---- Cohort defaults (master cells 31/30) ----
    default_bin_size_days: 2
    interp_version: v5p3
    cam: cam2
    dpi: 200

    # ---- Cross-cell extensions (Task 1 audit-confirmed) ----
    # Q4: jaw cell 32 added per-mouse multi-bin support (multiple
    # bin_sizes_days per mouse). Tongue cell 45 lacks this. Consolidated
    # module ports multi-bin to tongue too (default true; opt out via
    # per-bodypart override below).
    multi_bin_mean_trace: true

    # Q5: tongue legacy split mean video into Cell 47 (basic) + Cell 48
    # (with frame timestamps). Jaw cell 34 unifies. Consolidated module
    # follows jaw's shape with `with_frame_timestamps` kwarg defaulting
    # to true (matches the more-informative `# WITH FRAME TIMESTAMPS`
    # variant of tongue Cell 48 + the jaw Cell 34 default).
    with_frame_timestamps: true

    # ---- Per-bodypart override blocks ----
    # Audit found only CENTER_MODE diverges between master cells (Cell
    # 31/30). Mean-trace (Cell 45/32) adds two more divergent knobs:
    # ``xlim_pm_px`` (tongue=150, jaw=75 — different DLC pixel range
    # because the eye-centered jaw is much closer to spout) and
    # ``figure_width_inches`` (tongue=13.0, jaw=10.0 — newer jaw layout).
    tongue:
      center_mode: centered_spout_midpoint
      mean_trace:
        xlim_pm_px: 150
        figure_width_inches: 13.0
    jaw:
      center_mode: centered_eye_midpoint
      mean_trace:
        xlim_pm_px: 75
        figure_width_inches: 10.0

    # ---- Mean-trace sub-block (cells 45/32, Phase 7a.6 C4.2) ----
    # Cohort cross-session mean XY trajectory overlays (one PNG per
    # (animal, window, bin_size_days)). Per-side panels in the same
    # figure: R on the LEFT subplot, L on the RIGHT (legacy convention).
    # Y-axis inverted (0 at top) so the lick trajectory points downward
    # into the spout. Knobs sourced from jaw cell 32 (newer, 20260416)
    # since it added multi-bin + data-driven y-limits + per-window
    # subdir layout that tongue cell 45 lacks. Q4 lock: tongue gets the
    # multi-bin upgrade; ``bin_sizes_days`` defaults to a singleton list
    # of ``animal_info.bin_days`` if not overridden.
    mean_trace:
      do_x_range_filter: true       # legacy DO_X_RANGE_FILTER
      do_time_smooth: true          # legacy DO_TIME_SMOOTH
      time_smooth_movavg_ms: 40.0   # legacy TIME_SMOOTH_MOVAVG_MS
      stride: 1                     # legacy STRIDE; downsample factor
      do_rel_day_bin: true          # legacy DO_REL_DAY_BIN
      plot_individual_sessions_when_binned: true
      # Side colors: legacy uses pre=grey/post=plasma at the rel_day
      # level (not L/R). PRE_COLOR is a slightly lighter grey than the
      # master cell (0.6 here vs 0.3 there) — legacy quirk preserved.
      pre_color: "0.6"
      post_cmap: plasma
      line_alpha: 0.2
      line_lw: 0.8
      show_sem_tube: true
      tube_alpha: 0.15
      figure_height_inches: 6.2     # shared; figure_width_inches diverges per-bodypart
      # Data-driven y-limit (jaw cell 32 newer-only knob; ported back
      # to tongue per the consolidate-on-newer pattern).
      y_lim_mode: robust            # "robust" or "minmax"
      y_robust_pct: [1.0, 99.9]
      y_pad_frac: 0.1
      # Legend layout (C7.4 fix 2026-05-03 — supersedes C7.1 jaw 32
      # idiom). Even jaw cell 32's bbox_to_anchor=(0.75, 0.50) sits
      # INSIDE the L-trials subplot (subplots end at right=0.80, so a
      # figure-coord anchor at 0.75 lands inside the data area —
      # confirmed by PS51 20250429 worst-case render). C7.4 deviates
      # from legacy mean_trace's figure-coord legend convention and
      # adopts legacy single-axis (plot_overlay/plot_binned_overlay)
      # axis-coord idiom: anchor legend OUTSIDE the right axis edge
      # via ax-level legend(...) with bbox in axis coords.
      #
      # Knob semantics changed at C7.4 (figure-coord → axis-coord):
      #   legend_right_fraction: subplots_adjust(right=...) reserves
      #     this fraction of figure width for axes; rest is legend.
      #     Tuned for worst-case legend entry count (PS54/PS55 with
      #     bin_days=7 over Apr-Jul could yield up to ~12 bins;
      #     0.78 gives ~22% figure width for legend, sufficient at
      #     1-column).
      #   legend_anchor_x/y: bbox_to_anchor for ax-level legend in
      #     AXIS coordinates of the right subplot (ax_right).
      #     (1.02, 1.0) = just outside top-right corner of ax_right;
      #     legend is rendered with loc="upper left" so its
      #     upper-left corner sits at the anchor.
      #   panel_wspace: subplots_adjust(wspace=...). C7.6 bump from 0.10
      #     to 0.35: at the default 0.10 the L subplot's Y-axis tick
      #     labels overlapped the R subplot's data on PS51 2025-04-30
      #     (the worst-case session where R-trial tracks extend close
      #     to the L-subplot left margin). 0.35 clears the overlap with
      #     room to spare; if 0.4 turns out to be needed for any other
      #     animal/session, escalate.
      legend_right_fraction: 0.78
      legend_anchor_x: 1.02
      legend_anchor_y: 1.0
      panel_wspace: 0.35

    # ---- Mean-video sub-block (cells 47+48/34, Phase 7a.6 C4.3) ----
    # Cohort binned-mean session XY trajectory ANIMATIONS — Q5 lock
    # consolidates tongue's split (cell 47 basic + cell 48 with-frame-
    # timestamps) into one entry point with ``with_frame_timestamps: bool``
    # kwarg defaulting to true (matches jaw cell 34 + tongue cell 48
    # behavior). Implementation lands in C4.3 (matplotlib.animation +
    # ffmpeg dependency).
    mean_video:
      with_frame_timestamps: true
      animation_mode: dot           # "dot" or "cumulative"
      tail_ms: 100.0
      anim_fps: 60
      anim_speed: 0.125
      video_dpi: 200
      video_format: mp4             # "mp4" (needs ffmpeg) or "gif"
      save_both_modes: true         # emit both dot and cumulative
      mean_video_windows_subset:
        # Subset of windows (in ms, [pre, post] format) for which mean_video
        # should render MP4/GIF cohort animations. Other plot families
        # (individual_sessions, trial_overlays, session_overlays,
        # binned_overlays, mean_trace) still emit for ALL configured
        # windows; only mean_video honors this allow-list because MP4
        # render time scales with window duration and the long window
        # (-500/5000ms) takes much longer than the short window
        # (-100/1000ms) without proportional analytical value
        # (Priya 2026-05-02).
        #
        # Empty list or unset = render all configured windows (legacy /
        # default-conservative behavior). Phase 7a.6 default ships with
        # short window only.
        - [100, 1000]

