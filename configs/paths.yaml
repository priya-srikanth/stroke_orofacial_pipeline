# Path configuration for stroke_orofacial pipeline.
# PathResolver reads this file and resolves logical roots to platform-specific mounts.
#
# Mount values may be:
#   - A single string path
#   - A list of string paths (tried in order; first existing path wins)
#   - null (not available on this platform)

logical_roots:
  microscope_server:
    description: "Shared MICROSCOPE server (DLC outputs, alignment templates, raw videos)"
    # mac is a candidate list (first existing wins): the SMB share auto-mounts
    # at a different /Volumes point depending on which level was mounted —
    # /Volumes/Neurobio (Neurobio share), /Volumes/MICROSCOPE (…/MICROSCOPE),
    # or /Volumes/Priya (…/MICROSCOPE/Priya). Canonical Neurobio is first.
    mounts:
      mac:
        - "/Volumes/Neurobio/MICROSCOPE/Priya"  # confirmed on Priya's MacBook 2026-04-17
        - "/Volumes/MICROSCOPE/Priya"
        - "/Volumes/Priya"
      windows: "\\\\research.files.med.harvard.edu\\Neurobio\\MICROSCOPE\\Priya"

  microscope_pipeline_outputs:
    description: "Consolidated pipeline outputs (stroke_orofacial_pipeline)"
    # See microscope_server note re: candidate-list mountpoint tolerance.
    mounts:
      mac:
        - "/Volumes/Neurobio/MICROSCOPE/Priya/stroke_orofacial_pipeline_outputs"
        - "/Volumes/MICROSCOPE/Priya/stroke_orofacial_pipeline_outputs"
        - "/Volumes/Priya/stroke_orofacial_pipeline_outputs"
      windows: "\\\\research.files.med.harvard.edu\\Neurobio\\MICROSCOPE\\Priya\\stroke_orofacial_pipeline_outputs"

  wavesurfer_raw:
    description: >
      Raw wavesurfer .h5 files. Canonical location: MICROSCOPE under
      facerhythm_stroke_biomarker_exp/wavesurfer. On Mac, falls back to a
      local copy if the MICROSCOPE mirror is unavailable.
    mounts:
      mac:
        - "/Volumes/Neurobio/MICROSCOPE/Priya/facerhythm_stroke_biomarker_exp/wavesurfer"
        - "/Volumes/MICROSCOPE/Priya/facerhythm_stroke_biomarker_exp/wavesurfer"
        - "/Volumes/Priya/facerhythm_stroke_biomarker_exp/wavesurfer"
        - "/Users/Priya2/Documents/data/facerhythm_stroke_biomarker_exp/wavesurfer"
      windows: "\\\\research.files.med.harvard.edu\\Neurobio\\MICROSCOPE\\Priya\\facerhythm_stroke_biomarker_exp\\wavesurfer"

  camera_raw:
    description: >
      Raw Flea3 camera acquisition output (timestamp CSVs and .avi video files).
      Located on MICROSCOPE under Rich's data tree. Read-only — never write here.
    # mac candidate list (mountpoint tolerance; see microscope_server note).
    # No /Volumes/Priya variant — Rich's tree is not under the Priya share.
    mounts:
      mac:
        - "/Volumes/Neurobio/MICROSCOPE/Rich/data/2pRAM/facerhythm_stroke_biomarker_exp/camera"
        - "/Volumes/MICROSCOPE/Rich/data/2pRAM/facerhythm_stroke_biomarker_exp/camera"
      windows: "\\\\research.files.med.harvard.edu\\Neurobio\\MICROSCOPE\\Rich\\data\\2pRAM\\facerhythm_stroke_biomarker_exp\\camera"

  local_processed_spout:
    description: >
      Legacy spout-behavior processed data root (session_processing3/,
      basic_behavior_analysis3/). Lives on MICROSCOPE — Phase 7-pre-multi-half
      Task 1 audit (2026-05-05) confirmed Windows reachability via the same
      MICROSCOPE share that backs microscope_server. Read-only parity target;
      the new pipeline writes to microscope_pipeline_outputs.
    mounts:
      mac: "/Users/Priya2/Documents/data/facerhythm_stroke_biomarker_exp/analysis"
      windows: "\\\\research.files.med.harvard.edu\\Neurobio\\MICROSCOPE\\Priya\\facerhythm_stroke_biomarker_exp\\analysis"

# Derived paths (relative to logical roots)
derived:
  dlc_output: "{microscope_server}/DeepLabCut/O2_analysis/{animal}"
  dlc_train_config: "{microscope_server}/DeepLabCut/DLC_train_config"
  alignment_templates: "{microscope_server}/DeepLabCut/O2_analysis/alignment_templates"
