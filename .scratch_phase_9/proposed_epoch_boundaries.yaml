# Phase 9 Task 1 Part B — proposed per-animal recovery-epoch boundaries.
#
# DRAFT artifact for Priya editing. CC inspected
# pipeline_outputs/spout_behavior/spout_behavior_figures/<animal>/criteria_performance_relStroke.png
# for each of the 8 cohort animals and proposed boundary days based on
# the visible inflections in the Tone L / Tone R curves. Where the curve
# does not suggest a clear inflection point CC fell back to the kickoff
# default (acute=7 / subacute=21 / chronic=22).
#
# Schema (see EpochBoundaries dataclass in kickoff §"Hardcoded constants"):
#   acute_max_rel_day:    acute window  = rel_day [1, acute_max_rel_day]
#   subacute_max_rel_day: sub-acute     = rel_day [acute_max_rel_day + 1,
#                                                  subacute_max_rel_day]
#   chronic_min_rel_day:  chronic       = rel_day [chronic_min_rel_day, +inf)
#   Validation: chronic_min_rel_day > subacute_max_rel_day >=
#               acute_max_rel_day >= 1.
#
# Sentinel convention (kickoff line 190): animals that never reach a
# chronic plateau within their dataset get chronic_min_rel_day = 9999,
# which yields epoch_label = "sub_acute" for all post-stroke sessions
# beyond their acute window.
#
# Cohort breakdown (visual inspection findings):
#   Early cohort (PS46-PS50, bin_days=2): max rel_day ~ +14 in dataset.
#     None of these animals temporally reach the kickoff-default chronic
#     boundary at d+22. CC proposes chronic_min_rel_day=9999 for the
#     entire early cohort. Acute windows are tuned per-animal from the
#     observed R-tone trough.
#   Late cohort (PS51, PS54, PS55, bin_days=7): max rel_day ~ +70 in
#     dataset. All three reach chronic; severity scales PS51 < PS54 <
#     PS55. R-tone in PS54/PS55 essentially never recovers — chronic
#     window captures the persistent-deficit plateau for those animals.
#
# Priya: replace any per-animal block below with your judgment. Final
# stamped values land in configs/animals.yaml via Task 1.5.

PS46:
  # Early cohort. Sessions d-6..d+14. L-tone stays mostly high post-stroke
  # (mild decline trend). R-tone crashes to ~0 at d+1 and stays near zero
  # through d+5; clear inflection at d+6 (jumps to ~0.5) and plateau at
  # ~0.85 from d+7 onward. Severity: mild-moderate.
  epoch_boundaries:
    acute_max_rel_day: 5
    subacute_max_rel_day: 14
    chronic_min_rel_day: 9999

PS47:
  # Early cohort. Sessions d-6..d+14. L-tone steady ~0.85-0.95 throughout.
  # R-tone short acute dip — d+1 (~0.35) and d+2 (~0.58) only — fully
  # recovered to ~0.7-0.85 by d+3-d+4. Severity: very mild.
  epoch_boundaries:
    acute_max_rel_day: 2
    subacute_max_rel_day: 14
    chronic_min_rel_day: 9999

PS48:
  # Early cohort. Sessions d-6..d+14. L-tone essentially unaffected (stays
  # ~0.95). R-tone single sharp dip at d+1 (~0.35) only; immediately back
  # to >0.8 from d+2 onward. Severity: minimal.
  epoch_boundaries:
    acute_max_rel_day: 1
    subacute_max_rel_day: 14
    chronic_min_rel_day: 9999

PS49:
  # Early cohort. Sessions d-6..d+14. Both L and R drop post-stroke; R
  # hits ~0.15 at d+1, L hits ~0.5 at d+1; both recover through d+3-d+5
  # and reach near-baseline by d+7. Severity: moderate.
  epoch_boundaries:
    acute_max_rel_day: 3
    subacute_max_rel_day: 14
    chronic_min_rel_day: 9999

PS50:
  # Early cohort. Sessions d-4..d+14. Most severe deficit in early cohort:
  # both L AND R crash hard at d+1 (L=0.28, R=0.06); both reach ~0.85-0.9
  # by d+5-d+6 and stay elevated through d+14. Severity: moderate-severe.
  epoch_boundaries:
    acute_max_rel_day: 4
    subacute_max_rel_day: 14
    chronic_min_rel_day: 9999

PS51:
  # Late cohort. Sessions d-6..d+71 (bin_days=7). Deep dual crash d+1..d+9
  # (both sides near 0). L-tone partial recovery starting ~d+10-d+12;
  # sustained L-tone plateau from ~d+22 onward (variable but >0.7). R-tone
  # never substantially recovers (persistent deficit through d+71).
  # Severity: severe.
  epoch_boundaries:
    acute_max_rel_day: 9
    subacute_max_rel_day: 21
    chronic_min_rel_day: 22

PS54:
  # Late cohort. Sessions d-9..d+71. Deepest sustained acute crash of
  # the cohort: both sides near 0 from d+1 through ~d+16, no meaningful
  # recovery yet. L-tone slow recovery d+17..d+35 (reaches ~0.55 at d+20,
  # ~0.9 by d+35+). R-tone essentially never recovers (<0.15 throughout
  # the entire d+1..d+71 window). Severity: severe.
  epoch_boundaries:
    acute_max_rel_day: 16
    subacute_max_rel_day: 35
    chronic_min_rel_day: 36

PS55:
  # Late cohort. Sessions d-8..d+70. Most severe of all 8 animals; a
  # candidate "non-recoverer" phenotype. Both sides crash d+1; deep
  # bilateral deficit through ~d+19. L-tone partial / erratic recovery
  # from d+20+ (0.2-0.5 with intermittent peaks to 0.7 around d+30-d+45)
  # but never a clean plateau. R-tone essentially zero throughout.
  # Severity: most severe.
  #
  # Two reasonable framings:
  #   (a) Treat the slow, erratic L recovery as a subacute window and
  #       declare chronic at d+58+ when even the L plateau settles.
  #   (b) Treat PS55 as a non-recoverer and use chronic_min_rel_day=9999,
  #       which classifies every post-stroke session as sub_acute (lumps
  #       the entire trajectory). This makes PS55 the canonical
  #       non-recoverer phenotype anchor.
  # CC proposes framing (a) below as a starting point; Priya may prefer
  # framing (b) for the phenotype-pooling story.
  epoch_boundaries:
    acute_max_rel_day: 19
    subacute_max_rel_day: 57
    chronic_min_rel_day: 58
